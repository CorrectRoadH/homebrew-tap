name: Concord formula
on:
  workflow_dispatch:
  push:
    paths:
      - Formula/concord.rb
      - .github/workflows/concord.yml
jobs:
  install:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - run: brew install CorrectRoadH/tap/concord
      - run: brew test CorrectRoadH/tap/concord
