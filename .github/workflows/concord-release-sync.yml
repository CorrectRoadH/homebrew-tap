name: Concord release sync

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional canonical Concord tag (defaults to the latest release)
        required: false
        type: string

concurrency:
  group: concord-release-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      darwin_sha256: ${{ steps.identity.outputs.darwin_sha256 }}
      changed: ${{ steps.identity.outputs.changed }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check candidate integrity regressions
        run: python3 -m unittest discover -s scripts -p 'test_concord*.py' -v
      - name: Resolve and verify the public source release
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 scripts/concord-candidate.py
      - uses: actions/upload-artifact@v4
        if: steps.identity.outputs.changed == 'true'
        with:
          name: concord-tap-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 3

  brew:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: concord-tap-candidate
          path: ${{ runner.temp }}/concord-tap-candidate
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9
      - run: |
          git config --global user.name "Concord channel check"
          git config --global user.email "concord-check@example.invalid"
          # macOS runner images can link the obsolete keg into the current OpenSSL path.
          openssl_link="$(brew --prefix)/bin/openssl"
          if test -L "$openssl_link" && test "$(readlink "$openssl_link")" = "$(brew --prefix)/opt/openssl@1.1/bin/openssl"; then
            unlink "$openssl_link"
          fi
          brew tap-new local/concord-candidate
          cp "$RUNNER_TEMP/concord-tap-candidate/Formula/concord.rb" "$(brew --repository local/concord-candidate)/Formula/concord.rb"
          brew install --build-from-source local/concord-candidate/concord
          brew test local/concord-candidate/concord

  nix:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: concord-tap-candidate
          path: candidate
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - run: |
          nix flake check path:./candidate --print-build-logs
          nix run path:./candidate#concord -- --version

  update:
    needs: [prepare, brew, nix]
    timeout-minutes: 3
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.changed != 'true' || (needs.brew.result == 'success' && needs.nix.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.changed == 'true'
        with:
          name: concord-tap-candidate
          path: candidate
      - name: Record the verified metadata mapping
        if: needs.prepare.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
          DARWIN_SHA256: ${{ needs.prepare.outputs.darwin_sha256 }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            # A prior attempt may have pushed the mapping before receipt creation failed.
            for recipe in Formula/concord.rb nix/concord.nix; do
              git show "refs/tags/$TAG:$recipe" | cmp - "candidate/$recipe"
              cmp "$recipe" "candidate/$recipe"
            done
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "main changed after preparation; refusing stale candidate" >&2; exit 1; }
          cp candidate/Formula/concord.rb Formula/concord.rb
          cp candidate/nix/concord.nix nix/concord.nix
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/concord.rb nix/concord.nix
          git commit -m "Release Concord $VERSION for Homebrew and Nix"
          git tag -a "$TAG" -m "Concord $VERSION recipe; source linux-x64 sha256:$SHA256; darwin-arm64 sha256:$DARWIN_SHA256"
          git push --atomic origin HEAD:main "$TAG"
      - name: Publish the channel completion receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
          DARWIN_SHA256: ${{ needs.prepare.outputs.darwin_sha256 }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Concord $VERSION channels ready" \
            --notes "Homebrew and Linux Nix metadata map to Concord $VERSION. Archive identities, digests, Homebrew installations on Linux x64/macOS arm64, and Linux x64 Nix installation verified. Source archive SHA-256 (linux-x64): $SHA256; (darwin-arm64): $DARWIN_SHA256. Source: https://github.com/CorrectRoadH/Concord/releases/tag/$TAG . Upgrade: brew update && brew upgrade CorrectRoadH/tap/concord."
