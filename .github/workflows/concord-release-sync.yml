name: Concord release sync

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional canonical Concord tag (defaults to the latest release)
        required: false
        type: string

concurrency:
  group: concord-release-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      changed: ${{ steps.identity.outputs.changed }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and verify the public source release
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tag="$REQUESTED_TAG"
          if test -z "$tag"; then tag="$(gh release view --repo CorrectRoadH/Concord --json tagName --jq .tagName)"; fi
          if [[ ! "$tag" =~ ^(concord-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid tag: $tag" >&2
            exit 1
          fi
          version="${tag#concord-}"
          version="${version#v}"
          current="$(awk '$1 == "version" { gsub(/\"/, "", $2); print $2; exit }' Formula/concord.rb)"
          nix_current="$(awk '$1 == "version" { gsub(/\"|;/, "", $3); print $3; exit }' nix/concord.nix)"
          test "$current" = "$nix_current"
          if test "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version"; then
            echo "refusing version rollback from $current to $version" >&2; exit 1
          fi
          mkdir -p candidate/Formula candidate/nix asset
          gh api "repos/CorrectRoadH/Concord/releases/tags/$tag" > asset/release.json
          published_digest="$(jq -r --arg name "concord-sdlc-$version.tgz" '.assets[] | select(.name == $name) | .digest' asset/release.json)"
          [[ "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          sha256="${published_digest#sha256:}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          if test "$current" = "$version"; then
            current_sha="$(awk '$1 == "sha256" { gsub(/\"/, "", $2); print $2; exit }' Formula/concord.rb)"
            test "$current_sha" = "$sha256"
            nix_sha="$(awk '$1 == "sha256" { gsub(/\"|;/, "", $3); print $3; exit }' nix/concord.nix)"
            test "$nix_sha" = "$sha256"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" --repo CorrectRoadH/Concord --pattern "concord-sdlc-$version.tgz" --dir asset
          test "$(find asset -type f -name '*.tgz' | wc -l)" -eq 1
          test "$(sha256sum "asset/concord-sdlc-$version.tgz" | cut -d' ' -f1)" = "$sha256"
          tar -xOf "asset/concord-sdlc-$version.tgz" package/package.json > asset/package.json
          tar -xOf "asset/concord-sdlc-$version.tgz" package/npm-shrinkwrap.json > asset/npm-shrinkwrap.json
          test "$(jq -r .version asset/package.json)" = "$version"
          test "$(jq -r .version asset/npm-shrinkwrap.json)" = "$version"
          test "$(jq -r '.packages[""].version' asset/npm-shrinkwrap.json)" = "$version"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        if: steps.identity.outputs.changed == 'true'
      - name: Generate candidate Formula and Nix inputs
        if: steps.identity.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          TAG: ${{ steps.identity.outputs.tag }}
          SHA256: ${{ steps.identity.outputs.sha256 }}
        run: |
          cat > candidate/Formula/concord.rb <<RUBY
          class Concord < Formula
            desc "Local SDLC CLI for contracts, test evidence, and engineering memory"
            homepage "https://github.com/CorrectRoadH/Concord"
            url "https://github.com/CorrectRoadH/Concord/releases/download/$TAG/concord-sdlc-$VERSION.tgz"
            version "$VERSION"
            sha256 "$SHA256"

            depends_on "git"
            depends_on "node"
            depends_on "ripgrep"

            on_macos do
              depends_on macos: :sequoia
            end

            preserve_rpath

            def install
              system "npm", "install", *std_npm_args, "--ignore-scripts"
              # Keep verified addons opaque to Homebrew's Mach-O relocation/signing.
              (libexec/"lib/node_modules/concord-sdlc/dist/native").glob("*/hawdb.node").each do |binary|
                system "gzip", "-n", binary
              end
              (bin/"concord").write_env_script libexec/"bin/concord", PATH: "#{Formula["node"].opt_bin}:\$PATH"
            end

            def post_install
              (libexec/"lib/node_modules/concord-sdlc/dist/native").glob("*/hawdb.node.gz").each do |binary|
                system "gunzip", binary
              end
            end

            test do
              assert_equal "concord v#{version}", shell_output("#{bin}/concord --version").strip
              consumer = testpath/"consumer"
              consumer.mkpath
              Dir.chdir consumer do
                system "git", "init", "--quiet"
                system bin/"concord", "init", "--docs-only"
                system bin/"concord", "check"
                system bin/"concord", "test", "list", "--json"
                result = JSON.parse(shell_output("#{bin}/concord test list --json"))
                assert_equal "hit", result.fetch("cache").fetch("status")
              end
            end
          end
          RUBY
          cp nix/concord.nix candidate/nix/concord.nix
          # 0.6.0 coordinates through Node file APIs; the published 0.5 recipe
          # retains its helper until this candidate passes channel validation.
          perl -0pi -e 's/, util-linux \}:/ }:/; s/ ripgrep util-linux / ripgrep /g; s/concord git util-linux/concord git/g' candidate/nix/concord.nix
          perl -0pi -e 's/version = "[^"]*"/version = "$ENV{VERSION}"/' candidate/nix/concord.nix
          perl -0pi -e 's#url = "[^"]*"#url = "https://github.com/CorrectRoadH/Concord/releases/download/$ENV{TAG}/concord-sdlc-$ENV{VERSION}.tgz"#' candidate/nix/concord.nix
          perl -0pi -e 's/sha256 = "[^"]*"/sha256 = "$ENV{SHA256}"/' candidate/nix/concord.nix
          mkdir asset/package
          tar -xzf "asset/concord-sdlc-$VERSION.tgz" -C asset/package --strip-components=1
          npm_deps_hash="$(nix run nixpkgs#prefetch-npm-deps -- asset/package/npm-shrinkwrap.json)"
          NPM_DEPS_HASH="$npm_deps_hash" perl -0pi -e 's#npmDepsHash = "[^"]*"#npmDepsHash = "$ENV{NPM_DEPS_HASH}"#' candidate/nix/concord.nix
          ruby -c candidate/Formula/concord.rb
      - uses: actions/upload-artifact@v4
        if: steps.identity.outputs.changed == 'true'
        with:
          name: concord-tap-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 3

  update:
    needs: prepare
    timeout-minutes: 3
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.changed == 'true'
        with:
          name: concord-tap-candidate
          path: candidate
      - name: Record the verified metadata mapping
        if: needs.prepare.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            # A prior attempt may have pushed the mapping before receipt creation failed.
            for recipe in Formula/concord.rb nix/concord.nix; do
              git show "refs/tags/$TAG:$recipe" | cmp - "candidate/$recipe"
              cmp "$recipe" "candidate/$recipe"
            done
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "main changed after preparation; refusing stale candidate" >&2; exit 1; }
          cp candidate/Formula/concord.rb Formula/concord.rb
          cp candidate/nix/concord.nix nix/concord.nix
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/concord.rb nix/concord.nix
          git commit -m "Release Concord $VERSION for Homebrew and Nix"
          git tag -a "$TAG" -m "Concord $VERSION recipe; source asset sha256:$SHA256"
          git push --atomic origin HEAD:main "$TAG"
      - name: Publish the channel completion receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Concord $VERSION channels ready" \
            --notes "Homebrew and Linux Nix metadata map to Concord $VERSION. Package identity and digest verified; no installation or test suite was run by this sync. Source package SHA-256: $SHA256. Source: https://github.com/CorrectRoadH/Concord/releases/tag/$TAG . Upgrade: brew update && brew upgrade CorrectRoadH/tap/concord."
